name: Aladin product sync (every 5 minutes)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call protected Render sync endpoint
        run: curl --fail --silent --show-error -X POST "${{ secrets.STORE_SYNC_URL }}/sync.php?key=${{ secrets.SYNC_SECRET }}"
